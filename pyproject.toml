[project]
name = "carevoice-ai"
version = "0.1.0"
description = "A local healthcare voice assistant (learning project)"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2",
    # faster-whisper uses the "av" library to read audio files.
    # av version 19 changed something that faster-whisper 1.2 relies on, so we stay below 19.
    "av<19",
    "fastapi[standard]>=0.156.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "chromadb>=1.5.9",
    "sqlalchemy>=2.0",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Let tests import our code with "from app.main import app".
pythonpath = ["."]
markers = [
    "model: uses the real AI models through Ollama (slow, needs Ollama running). Run with: uv run pytest -m model",
]
# By default, skip the slow real-model tests. "-m model" on the command line overrides this.
addopts = "--strict-markers -m 'not model'"

[tool.pylint.main]
# "av" is compiled C code; let Pylint load it so it can see names like FFmpegError.
extension-pkg-allow-list = ["av"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
# Our function names (e.g. test_chat_rejects_an_empty_message) already say what they do.
# In tests, "assert x == []" is clearer than "assert not x": pytest then shows what x actually was.
# Same for classes: names like DoctorNotFound or class Shift(BaseModel) already say what they are.
disable = ["missing-function-docstring", "missing-class-docstring", "use-implicit-booleaness-not-comparison"]

[tool.pylint.typecheck]
# SQLAlchemy and Alembic create these attributes at runtime, which Pylint can't see (false "no-member" errors).
ignored-modules = ["alembic.context"]
generated-members = ["sessionmaker.begin"]

[tool.pylint.design]
# Database models and Pydantic models are meant to hold data, not to have methods.
min-public-methods = 0
# Booking functions take their details as named keyword arguments (patient_id=..., doctor_id=...), which keeps
# calls readable even with more than Pylint's default limit of 5.
max-args = 10
